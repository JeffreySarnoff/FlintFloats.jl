note = "Elementwise finite-only add, ALLOW_UNDERFLOW context; L+2 word stride. L=1..4 specialized, larger L call scalar add. Context read-only. Failed outputs not published: Julia uses separate initialized scratch and commits only on GR_SUCCESS. No partial-overlap native calls."

