note = "Elementwise finite-only multiply; L=1,2 specialized, larger L use scalar mul (or sqr when x==y). Error guarantee is operation-specific, not correctly rounded. Context read-only. Underflow flushes zero; overflow nonzero status; scratch isolates failed lanes and destination aliases."

