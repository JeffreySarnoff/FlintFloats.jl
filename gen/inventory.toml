sig = "void(d2b_ptr, d2b_srcptr, d2b_srcptr, slong)"
kind = "export"
status = "none"
note = "Rigorous elementwise add; len structs, not doubles. SIMD blocks load all inputs before storing; exceptional blocks fall back before storing. Exact res==x/res==y allowed; partial overlap unsupported. Nonfinite/overflow lanes become whole-line balls as in scalar add. Source: template.inc DBV(vec_add), DB(_vaddsub4), DB(_add_impl); upstream t-vec.c and t-vec_aliasing.c."

# M4b: nfloat.h and src/nfloat/nfloat.c. Both return OR-combined GR_* statuses.
