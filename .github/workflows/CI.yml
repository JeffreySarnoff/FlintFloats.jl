name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      host_validation:
        description: Run native checks on the provisioned compatible development runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sources:
    name: Source provenance and deterministic bindings (no native load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
          arch: x64
      - run: julia --startup-file=no scripts/check_sources.jl
      - run: julia --startup-file=no test/ci_host_tests.jl
      - run: julia --startup-file=no gen/generate.jl
      - run: git diff --exit-code -- src/libflint/generated
  native:
    name: Controlled development-host validation
    if: github.event_name == 'workflow_dispatch' && inputs.host_validation
    runs-on: [self-hosted, Linux, X64, flintfloats-i9-14900k-glibc243]
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '4'
      DEPS_PREFIX: ${{ vars.FLINTFLOATS_DEPS_PREFIX }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
          arch: x64
      - name: Validate host before native load
        run: julia --startup-file=no scripts/check_host.jl
      - name: Instantiate and install bundled artifact
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build("FLINT_jll")'
      - name: Numerical, ownership, and Julia contracts
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Audit exported symbols
        run: |
          julia --project=gen -e 'using Pkg; Pkg.instantiate()'
          julia --project=gen gen/audit.jl
          julia --project=gen scripts/check_abi.jl
      - name: Build documentation and doctests (no deployment)
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs docs/make.jl
