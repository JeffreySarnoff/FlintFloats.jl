name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sources:
    name: Source provenance and deterministic bindings (no native load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
          arch: x64
      - name: Validate GitHub workflow expressions
        run: |
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$actionlint_archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_archive" | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/CI.yml
      - run: julia --startup-file=no scripts/check_sources.jl
      - run: julia --startup-file=no test/ci_host_tests.jl
      - run: julia --startup-file=no gen/generate.jl
      - run: git diff --exit-code -- src/libflint/generated
  native:
    name: Portable Linux x86_64 numerical and ABI validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '4'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
          arch: x64
      - name: Validate host before native load
        run: julia --startup-file=no scripts/check_host.jl
      - name: Instantiate and install bundled artifact
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false); Pkg.build("FLINT_jll")'
      - name: Audit exported symbols
        env:
          DEPS_PREFIX: ${{ runner.temp }}/flint-abi-headers
        run: |
          julia --project=gen -e 'using Pkg; Pkg.instantiate()'
          julia --project=gen gen/audit.jl
          julia --startup-file=no scripts/prepare_abi_headers.jl "$DEPS_PREFIX"
          julia --project=gen scripts/check_abi.jl
      - name: Numerical, ownership, and Julia contracts
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Build documentation and doctests (no deployment)
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs docs/make.jl
